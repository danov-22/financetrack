<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#4f46e5"/><title>Bewlet Admin</title><link rel="icon" href="favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="admin.css"/><link rel="stylesheet" href="admin-enhancements.css"/></head>
<body><header><a href="/" class="brand"><img src="favicon.svg" alt=""/>Bewlet Admin</a><nav><a href="/app">Open Bewlet</a><button id="admin-signout">Sign out</button></nav></header>
<main><section class="admin-hero"><div><span>ADMIN CONTROL</span><h1>Bewlet users</h1><p>Review registrations, monitor approved access, and track founder pricing by region.</p></div></section>
<section class="admin-stats"><button data-admin-view="pending"><strong id="pending-count">—</strong><span>Waiting</span></button><button data-admin-view="approved"><strong id="approved-count">—</strong><span>Approved</span></button><button data-admin-view="active"><strong id="active-count">—</strong><span>Active · 30 days</span></button><button data-admin-view="ID"><strong id="id-founder-count">—</strong><span>Indonesia founders</span></button><button data-admin-view="INTL"><strong id="intl-founder-count">—</strong><span>International founders</span></button></section>
<section class="admin-toolbar"><input id="admin-search" type="search" placeholder="Search name or email…"/><select id="admin-filter"><option value="pending">Pending</option><option value="approved">Approved</option><option value="active">Active in last 30 days</option><option value="ID">Indonesia users</option><option value="INTL">International users</option><option value="rejected">Rejected</option><option value="suspended">Suspended</option><option value="all">All accounts</option></select><button id="admin-refresh">Refresh</button></section>
<div id="admin-status" role="status"></div><section id="admin-list" class="admin-list"></section></main>
<script type="module" src="admin.js"></script></body></html>
